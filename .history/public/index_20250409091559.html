<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPTX to HTML Converter</title>
    <link href="/styles/main.css" rel="stylesheet">
    <script src="/js/main.js" defer></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">PPTX to HTML Converter</h1>
            <p class="text-gray-600 mt-2">Upload your PowerPoint file to convert it to accessible HTML</p>
        </header>

        <main class="max-w-2xl mx-auto">
            <div id="error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>

            <form id="upload-form" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="pptx-file">
                        Choose PPTX File
                    </label>
                    <input class="w-full" type="file" id="pptx-file" accept=".pptx" required>
                </div>
                <div class="flex items-center justify-between">
                    <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">
                        Convert to HTML
                    </button>
                </div>
            </form>

            <div id="loading" class="hidden text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto"></div>
                <p class="mt-4 text-gray-600">Processing your file...</p>
            </div>

            <div id="results" class="hidden bg-white shadow-md rounded px-8 py-6">
                <!-- Results will be inserted here -->
            </div>
        </main>
    </div>
</body>
</html>
